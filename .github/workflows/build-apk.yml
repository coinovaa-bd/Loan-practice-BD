name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      
      - run: npm install
      - run: npx cap add android || true
      - run: npx cap sync android
            - run: for d in android/app/src/main/res/mipmap-*/; do cp 5ce*.png "$d/ic_launcher.png"; cp 5ce*.png "$d/ic_launcher_round.png"; cp 5ce*.png "$d/ic_launcher_foreground.png"; done
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
